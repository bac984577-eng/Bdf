name: Build PDF Reader APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت مكونات Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::تعذر العثور على sdkmanager."
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: إنشاء مشروع Android
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/pdfreader

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PDFReader"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.pdfreader'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.pdfreader'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="قارئ PDF"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name="com.example.pdfreader.MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/pdfreader/MainActivity.java <<'EOF'
          package com.example.pdfreader;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final int PICK_PDF = 100;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(32, 32, 32, 32);

                  TextView title = new TextView(this);
                  title.setText("قارئ ملفات PDF");
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER);

                  TextView description = new TextView(this);
                  description.setText("اختر ملف PDF من جهازك.");
                  description.setTextSize(16);
                  description.setGravity(Gravity.CENTER);

                  Button openButton = new Button(this);
                  openButton.setText("اختيار ملف PDF");

                  layout.addView(title);
                  layout.addView(description);

                  layout.addView(
                      openButton,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );

                  setContentView(layout);

                  openButton.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("application/pdf");
                      startActivityForResult(intent, PICK_PDF);
                  });
              }

              @Override
              protected void onActivityResult(
                      int requestCode, int resultCode, Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == PICK_PDF &&
                      resultCode == RESULT_OK &&
                      data != null) {

                      Uri uri = data.getData();

                      if (uri != null) {
                          Intent intent = new Intent(Intent.ACTION_VIEW);
                          intent.setDataAndType(uri, "application/pdf");
                          intent.addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          );

                          try {
                              startActivity(intent);
                          } catch (Exception e) {
                              Toast.makeText(
                                  this,
                                  "لم يتم العثور على تطبيق لعرض PDF.",
                                  Toast.LENGTH_LONG
                              ).show();
                          }
                      }
                  }
              }
          }
          EOF

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بناء APK
        shell: bash
        run: |
          set -e
          gradle assembleDebug --no-daemon

      - name: التحقق من APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::لم يتم إنشاء ملف APK."
            exit 1
          fi

          echo "تم إنشاء APK بنجاح."
          ls -lh "$APK"

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
