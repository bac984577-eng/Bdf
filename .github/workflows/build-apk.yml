name: Build PDF Reader APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android PDF Reader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/pdfreader
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PDFReader"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.pdfreader'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.pdfreader'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="قارئ PDF"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <activity
                      android:name="com.example.pdfreader.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/pdfreader/MainActivity.java <<'EOF'
          package com.example.pdfreader;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private static final int PICK_PDF = 100;
              private LinearLayout root;
              private WebView webView;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("قارئ ملفات PDF");
                  title.setTextSize(23);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setTextColor(Color.rgb(35, 65, 110));
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(16, 24, 16, 24);
                  root.addView(title);

                  Button open = new Button(this);
                  open.setText("اختيار ملف PDF");
                  root.addView(open, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT));

                  status = new TextView(this);
                  status.setText("اختر ملف PDF من جهازك لفتحه.");
                  status.setTextSize(16);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(12, 16, 12, 16);
                  root.addView(status);

                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(false);
                  webView.setWebViewClient(new WebViewClient());

                  root.addView(webView, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1));

                  setContentView(root);

                  open.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("application/pdf");
                      startActivityForResult(intent, PICK_PDF);
                  });
              }

              @Override
              protected void onActivityResult(
                  int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == PICK_PDF &&
                      resultCode == RESULT_OK && data != null) {
                      Uri uri = data.getData();

                      if (uri != null) {
                          status.setText("تم اختيار ملف PDF.");
                          Toast.makeText(this,
                              "تم اختيار الملف. قد يحتاج العرض إلى عارض PDF متوافق.",
                              Toast.LENGTH_LONG).show();

                          Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                          viewIntent.setDataAndType(uri, "application/pdf");
                          viewIntent.addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION);

                          try {
                              startActivity(viewIntent);
                          } catch (Exception e) {
                              Toast.makeText(this,
                                  "لا يوجد عارض PDF خارجي مثبت.",
                                  Toast.LENGTH_LONG).show();
                          }
                      }
                  }
              }
          }
          EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
